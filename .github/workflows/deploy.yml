
name: BrokeBuddy Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brokebuddy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Backend
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: 842190336619.dkr.ecr.ap-southeast-2.amazonaws.com
      EC2_INSTANCE_ID: i-0750821d04cddc66c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Python image
        uses: docker/build-push-action@v6
        with:
          context: ./python
          push: true
          tags: |
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-python:${{ github.sha }}
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-python:latest

      - name: Build and push Express server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-server:${{ github.sha }}
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-server:latest

      - name: Deploy to EC2 through SSM
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          REMOTE_COMMAND=$(cat <<EOF
          set -eu
          cd /home/ssm-user/BrokeBuddy-1.0

          export SERVER_IMAGE="${ECR_REGISTRY}/brokebuddy-server:${IMAGE_TAG}"
          export PYTHON_IMAGE="${ECR_REGISTRY}/brokebuddy-python:${IMAGE_TAG}"

          aws ecr get-login-password --region "${AWS_REGION}" |
            sudo docker login --username AWS --password-stdin "${ECR_REGISTRY}"

          sudo --preserve-env=SERVER_IMAGE,PYTHON_IMAGE docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml pull

          sudo --preserve-env=SERVER_IMAGE,PYTHON_IMAGE docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans

          for i in \$(seq 1 36); do
            SERVER_STATUS=\$(sudo docker inspect -f '{{.State.Health.Status}}' brokebuddy-server 2>/dev/null || true)
            PYTHON_STATUS=\$(sudo docker inspect -f '{{.State.Health.Status}}' brokebuddy-python 2>/dev/null || true)

            if [ "\$SERVER_STATUS" = "healthy" ] && [ "\$PYTHON_STATUS" = "healthy" ]; then
              echo "Both backend containers are healthy."
              exit 0
            fi

            sleep 5
          done

          sudo docker ps -a
          sudo docker logs --tail 80 brokebuddy-server || true
          sudo docker logs --tail 80 brokebuddy-python || true
          echo "Deployment health check failed."
          exit 1
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "BrokeBuddy deployment ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or timed out. SSM status: $STATUS"
            exit 1
          fi
