
name: BrokeBuddy Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brokebuddy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy Backend
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: 842190336619.dkr.ecr.ap-southeast-2.amazonaws.com
      EC2_INSTANCE_ID: i-0750821d04cddc66c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Python image
        uses: docker/build-push-action@v6
        with:
          context: ./python
          push: true
          tags: |
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-python:${{ github.sha }}
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-python:latest

      - name: Build and push Express server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-server:${{ github.sha }}
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-server:latest

      - name: Deploy to EC2 through SSM
        id: deploy
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          REMOTE_COMMAND=$(cat <<EOF
          set -eu
          cd /home/ssm-user/BrokeBuddy-1.0

          REGISTRY="${ECR_REGISTRY}"
          SERVER_CONTAINER="brokebuddy-server"
          PYTHON_CONTAINER="brokebuddy-python"

          # Record the currently deployed image references for rollback.
          PREVIOUS_SERVER_IMAGE=\$(sudo docker inspect -f '{{.Config.Image}}' "\$SERVER_CONTAINER")
          PREVIOUS_PYTHON_IMAGE=\$(sudo docker inspect -f '{{.Config.Image}}' "\$PYTHON_CONTAINER")

          echo "Previous server image: \$PREVIOUS_SERVER_IMAGE"
          echo "Previous Python image: \$PREVIOUS_PYTHON_IMAGE"

          # Authenticate Docker with ECR.
          aws ecr get-login-password --region "${AWS_REGION}" |
            sudo docker login --username AWS --password-stdin "\$REGISTRY"

          health_check() {
            for i in \$(seq 1 36); do
              SERVER_STATUS=\$(sudo docker inspect -f '{{.State.Health.Status}}' "\$SERVER_CONTAINER" 2>/dev/null || true)
              PYTHON_STATUS=\$(sudo docker inspect -f '{{.State.Health.Status}}' "\$PYTHON_CONTAINER" 2>/dev/null || true)

              echo "Health check \$i/36: server=\$SERVER_STATUS, python=\$PYTHON_STATUS"

              if [ "\$SERVER_STATUS" = "healthy" ] && [ "\$PYTHON_STATUS" = "healthy" ]; then
                echo "Both backend containers are healthy."
                return 0
              fi

              sleep 5
            done

            return 1
          }

          rollback() {
            echo "ROLLBACK_STARTED: restoring previous images"

            export SERVER_IMAGE="\$PREVIOUS_SERVER_IMAGE"
            export PYTHON_IMAGE="\$PREVIOUS_PYTHON_IMAGE"

            if sudo --preserve-env=SERVER_IMAGE,PYTHON_IMAGE docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml pull &&
               sudo --preserve-env=SERVER_IMAGE,PYTHON_IMAGE docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-build --remove-orphans &&
               health_check; then
              echo "ROLLBACK_RESULT=SUCCESS"
              return 0
            fi

            echo "ROLLBACK_RESULT=FAILED"
            sudo docker ps -a || true
            sudo docker logs --tail 80 "\$SERVER_CONTAINER" || true
            sudo docker logs --tail 80 "\$PYTHON_CONTAINER" || true
            return 1
          }

          # Use the current commit's immutable image tags.
          export SERVER_IMAGE="\${REGISTRY}/brokebuddy-server:${IMAGE_TAG}"
          export PYTHON_IMAGE="\${REGISTRY}/brokebuddy-python:${IMAGE_TAG}"

          echo "Pulling new images..."
          if ! sudo --preserve-env=SERVER_IMAGE,PYTHON_IMAGE docker compose \
            -f docker-compose.yml -f docker-compose.prod.yml pull; then
            echo "DEPLOYMENT_RESULT=FAILED_PULL"
            exit 1
          fi

          echo "Starting new deployment..."
          if ! sudo --preserve-env=SERVER_IMAGE,PYTHON_IMAGE docker compose \
            -f docker-compose.yml -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans; then
            echo "DEPLOYMENT_RESULT=FAILED_START"
            echo "New deployment failed. Rolling back..."

            if rollback; then
              echo "Previous deployment restored successfully."
            else
              echo "CRITICAL: deployment and rollback both failed."
            fi

            exit 1
          fi

          echo "Waiting for both containers to become healthy..."
          if health_check; then
            echo "DEPLOYMENT_RESULT=SUCCESS"

            # Remove unused local images only after successful deployment.
            echo "Removing unused local Docker images..."
            sudo docker image prune -af

            echo "Final disk usage:"
            df -h /
            sudo docker system df
            exit 0
          fi

          echo "DEPLOYMENT_RESULT=FAILED_HEALTH_CHECK"
          echo "Deployment failed health checks. Rolling back now..."

          sudo docker ps -a || true
          sudo docker logs --tail 80 "\$SERVER_CONTAINER" || true
          sudo docker logs --tail 80 "\$PYTHON_CONTAINER" || true

          if rollback; then
            echo "Previous deployment restored successfully."
          else
            echo "CRITICAL: deployment and rollback both failed."
          fi

          # Keep unused images for diagnosis and recovery after failure.
          exit 1
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$REMOTE_COMMAND" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "BrokeBuddy deployment ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed or timed out. SSM status: $STATUS"
            exit 1
          fi
