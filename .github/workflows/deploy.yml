
name: BrokeBuddy Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brokebuddy-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Backend Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=842190336619.dkr.ecr.ap-southeast-2.amazonaws.com" >> "$GITHUB_ENV"

      - name: Build and push Python image
        uses: docker/build-push-action@v6
        with:
          context: ./python
          push: true
          tags: |
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-python:${{ github.sha }}
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-python:latest

      - name: Build and push Express server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-server:${{ github.sha }}
            842190336619.dkr.ecr.ap-southeast-2.amazonaws.com/brokebuddy-server:latest
